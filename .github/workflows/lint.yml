name: Lint

on:
  # master only. A bare `push:` also matches every pull request branch and
  # every tag, so a pull request ran this twice and `git push --tags` ran it
  # again for a tag whose release workflow already runs the same suite.
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# Nothing here writes anything. The default token is whatever the repository
# settings hand out, which is not a decision worth leaving to a settings page.
permissions:
  contents: read

concurrency:
  # Per commit on master, per branch on a pull request. Grouping master by ref
  # made consecutive pushes queue behind each other instead of cancelling —
  # which reads as "CI has not finished" for as long as the queue is deep, and
  # is what made a release refuse to cut for ten minutes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  syntax:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every PHP version any supported Magento release runs on. 7.4 is the
        # floor and the one most easily broken by accident.
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      # No PHPUnit: no single major spans 7.4 to 8.5, so a suite built on one
      # would only ever run on the half of the range least likely to break.
      # With no dependency at all these run everywhere, here, in a second.
      - name: Unit tests
        run: php tests/unit.php

  validate:
    name: composer validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '7.4'
          coverage: none

      - run: composer validate --strict

  analyse:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --no-interaction --no-progress

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      # Again, with composer/composer present: the Collector suite needs a real
      # Composer object, and the syntax job deliberately installs nothing.
      - name: Unit tests, including the collector suite
        run: php tests/unit.php

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The test harnesses are bash, and bash is where the subtle bugs live.
      - name: shellcheck
        run: shellcheck --severity=warning tests/*.sh bin/release

  floor:
    name: Composer 2.2 / lowest deps (PHP 7.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # composer.json claims a Composer 2.2 floor and composer.lock is not
      # committed, so every other job resolves the newest of everything and the
      # claim goes untested. Composer 2.3 dropped PHP < 7.2 and 2.2 is the LTS,
      # which is what an older Magento box actually has. The interface that
      # breaks across it is real: 2.2 declares getInstallPath(): string, 2.3+
      # declares it nullable.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '7.4'
          tools: 'composer:2.2'
          coverage: none

      - run: composer update --prefer-lowest --prefer-stable --no-interaction --no-progress

      # The collector suite skips itself here, and that is the point rather than
      # a gap: it needs the nullable getInstallPath() that only 2.3+ declares.
      # What this proves is that the floor resolves at all, and that everything
      # not needing a real Composer object runs on the oldest supported pair.
      - name: Unit tests
        run: php tests/unit.php
