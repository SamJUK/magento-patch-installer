name: Refresh EOL manifest

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

# The plugin never calls magento.watch at patch time, so the shipped manifest is
# refreshed here instead and lands as a reviewable pull request.

# The only workflow here that writes anything, so it is the only one where the
# token matters. Nothing by default; the one job that opens a pull request asks
# for exactly what that needs.
permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Rebuild the manifest
        run: bin/refresh-eol

      - name: Open a pull request when the dates changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: 'chore: refresh Magento end-of-life manifest'
          title: 'chore: refresh Magento end-of-life manifest'
          body: |
            Automated refresh of `resources/magento-eol.json` from magento.watch.

            Review the diff before merging — a version moving to end of life
            turns the plugin's advisory red for every store still on it.
          branch: chore/refresh-eol
          add-paths: resources/magento-eol.json
          delete-branch: true
